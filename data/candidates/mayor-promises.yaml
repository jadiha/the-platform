  # ---- Rent and housing ----
  - candidate: "Alexander, Chris"
    room: housing
    rule: {type: homes, count: 3000, by: "first year in office"}
    text: "As mayor, I would aim to see construction start on at least 3,000 affordable units in my first year in office, rising to 10,000 affordable housing starts in 2029."
    url: https://www.chrisalexander.ca/policies/build-affordable-housing
    archive: https://web.archive.org/web/20261013042717/https://www.chrisalexander.ca/policies/build-affordable-housing
    retrieved: 2026-10-13
    status: draft
    note: "Chris Alexander ended his campaign on October 6, 2026. His name is still on the ballot."

  - candidate: "Bradford, Brad"
    room: housing
    rule: {type: other, cost_millions_per_year: 300}
    text: "If you're buying your first home, or you're a Toronto homeowner selling one home to buy another, you would pay no Municipal Land Transfer Tax on the first $1.1 million of the purchase."
    url: https://bradford26.ca/news/brad-bradford-toronto-mayor-will-eliminate-torontos-land-transfer-tax-for-the-average-homebuyer
    archive: https://web.archive.org/web/20261013042354/https://bradford26.ca/news/brad-bradford-toronto-mayor-will-eliminate-torontos-land-transfer-tax-for-the-average-homebuyer
    retrieved: 2026-10-13
    status: draft
    cost_text: "Cost and funding: the exemption reduces Municipal Land Transfer Tax revenue by approximately $300 million a year."

  - candidate: "Chow, Olivia"
    room: housing
    rule: {type: homes, count: 10000, by: "next year"}
