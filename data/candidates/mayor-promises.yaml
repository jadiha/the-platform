    url: https://www.oliviachow.ca/plan?active=building_more_housing
    archive: https://web.archive.org/web/20261013043027/https://www.oliviachow.ca/plan?active=building_more_housing
    retrieved: 2026-10-13
    status: draft

  - candidate: "Srivastava, Sandeep"
    room: housing
    rule: {type: homes, count: 5600, by: "through the federal partnership"}
    text: "5,600 rental homes delivered through federal partnership, with 4,500 starting construction by end of 2026"
    url: https://sandeepsrivastavafortorontomayor.wordpress.com/platform/
    archive: https://web.archive.org/web/20261013043055/https://sandeepsrivastavafortorontomayor.wordpress.com/platform/
