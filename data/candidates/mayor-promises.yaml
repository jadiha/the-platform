# Mayoral promises shown in the "What if they do it?" panels and on the walk's plaques.
#
# Rules (spec §3, §4.4):
# - Only promises the candidate published on their own campaign site (listed on the City Clerk's
#   candidate list). No news reports, no opponents' cost estimates.
# - `text` is copied word for word. The site links to `url` with the sentence highlighted.
# - status: draft until a person has opened the link and confirmed the words match.
#   Only `checked` promises appear on the built site.
# - Every mayoral campaign site on the Clerk's list was read on 2026-10-13 (see `scan` below).
#   A candidate not in this file had no promise with a number or rule on these topics there.

scan:
  date: 2026-10-13
  method: "Read every campaign website listed on the City Clerk's certified candidate list (up to 14 pages each: home, platform, issue and news pages). Social media accounts were not read."
  no_website: [Abdulkadir, Buffey, Choy, Clarke, Cruze, Dorville, Ellis, Fraser, Hall, Handjis, He, Lee, Levermany, Mayanja, Mercieca, Osuji, Prokos, Tong, Weenen, "Yohannes, Henoke", "Yohannes, Leila", Zandkarimi]
  social_only: ["Chow, Braeden", Desai, Frederick, Gong, Kaaki, Sayers]
  unreadable: ["Brown, Darrell"]   # electdarrellbrown.ca returned an empty page on 2026-10-13; re-check

promises:
  # ---- Your tax bill ----
  - candidate: "Abdulsalam, Bahira"
    room: tax
    rule: {type: freeze, years: 1, scope: residential}
    text: "Property tax: a one-year freeze on residential property taxes, then taxes geared to what households can afford to pay."
    url: https://bahira.ca/
    archive: https://web.archive.org/web/20261013042202/https://bahira.ca/
    retrieved: 2026-10-13
    status: draft

  - candidate: "Bradford, Brad"
    room: tax
    rule: {type: freeze, years: 1, then: below-inflation}
    text: "Bradford's plan for families starts with affordability: a property tax freeze in year one"
    url: https://bradford26.ca/news/brad-bradford-mayor-to-toronto-moms-this-should-be-the-best-city-in-the-world-to-raise-a-family-right-now-it-doesnt-feel-like-it
    archive: https://web.archive.org/web/20261013042304/https://bradford26.ca/news/brad-bradford-mayor-to-toronto-moms-this-should-be-the-best-city-in-the-world-to-raise-a-family-right-now-it-doesnt-feel-like-it
    retrieved: 2026-10-13
    status: draft

  - candidate: "Hartley, Jack"
    room: tax
    rule: {type: percent, value: -53}
    text: "We will also decrease Torontonians' property taxes by 53%"
    url: https://hartley4mayor.netlify.app/
    archive: https://web.archive.org/web/20261013042507/https://hartley4mayor.netlify.app/
    retrieved: 2026-10-13
    status: draft

  - candidate: "McVie, Sarah"
    room: tax
    rule: {type: freeze, years: 2}
    text: "We will institute a two-year freeze on property taxes"
    url: https://mayormcvie.ca/platform
    archive: https://web.archive.org/web/20261013042558/https://mayormcvie.ca/platform
    retrieved: 2026-10-13
    status: draft

  # ---- Getting around ----
  - candidate: "Abdulsalam, Bahira"
    room: transit
    rule: {type: fare-free-phased, first: [low-income, youth, seniors]}
    text: "Frozen for all; free for the first phase of riders (low-income, youth, seniors); universal free when a provincial/federal partner is secured"
    url: https://bahira.ca/money-taxes/
    archive: https://web.archive.org/web/20261013042241/https://bahira.ca/money-taxes/
    retrieved: 2026-10-13
    status: draft

  - candidate: "Chow, Olivia"
    room: transit
    rule: {type: weekly-cap, trips: 10}
    text: "The new weekly fare cap means that after you pay for 10 trips, every additional TTC trip that week is free."
    url: https://www.oliviachow.ca/olivia_chow_will_make_ttc_rides_free_after_10_trips_each_week
    archive: https://web.archive.org/web/20261013042838/https://www.oliviachow.ca/olivia_chow_will_make_ttc_rides_free_after_10_trips_each_week
    retrieved: 2026-10-13
    status: draft

  - candidate: "Chow, Olivia"
    room: transit
    rule: {type: fare-freeze}
