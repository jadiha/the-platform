# Story cards for mayoral candidates who listed a campaign website with the City Clerk.
# Same fields for everyone. Every quote is word for word from the page in `url`, read 2026-10-13.
# `record` is public record only (City of Toronto documents). Status: draft until a person checks
# each quote against its page; only `checked` items are shown on the built site.
#
# topics: tax | transit | housing | safety | money | other

record_sources:
  by2023: {title: "City of Toronto: Declaration of Results, 2023 By-Election for Mayor", url: "https://www.toronto.ca/wp-content/uploads/2023/06/8eef-Declaration-of-Results-for-the-2023-Toronto-By-Election-for-Mayor-Final.pdf"}
  mayor: {title: "City of Toronto: Mayor Olivia Chow", url: "https://www.toronto.ca/city-government/council/office-of-the-mayor/"}
  ward19: {title: "City of Toronto: Councillor, Ward 19 Beaches-East York", url: "https://www.toronto.ca/city-government/council/members-of-council/councillor-ward-19/"}

profiles:
  - candidate: "Abdulsalam, Bahira"
    about: {text: "Dr. Bahira Abdulsalam, PhD, P.Eng., is a structural engineer, educator and independent candidate for Mayor of Toronto.", url: "https://bahira.ca/"}
    record: [{text: "Ran for mayor in the 2023 by-election: 913 votes", src: by2023}]
    priorities:
      - {topic: other, text: "Keep the Gardiner and DVP in Toronto’s hands, and fix them.", url: "https://bahira.ca/"}
      - {topic: housing, text: "Keep public land public and put homes you can own on top of it, plus more affordable housing and real protection for tenants.", url: "https://bahira.ca/"}
      - {topic: transit, text: "A free TTC, phased in and funded at every step, running often and on time.", url: "https://bahira.ca/"}
      - {topic: money, text: "Honest budgets, open books, independent audits, a live projects dashboard, and a full public accounting of World Cup spending.", url: "https://bahira.ca/"}
      - {topic: safety, text: "Guns and trafficking, violence interruption, the drug crisis as safety and health, a safer TTC, and ending human trafficking, with accountable policing and real supports.", url: "https://bahira.ca/"}
    archive:
      "https://bahira.ca/": "https://web.archive.org/web/20261013042202/https://bahira.ca/"
    status: checked
    checked_on: 2026-10-13

  - candidate: "Alexander, Chris"
    note: "Chris Alexander ended his campaign on October 6, 2026. His name is still on the ballot."
    about: {text: "He was the Member of Parliament for Ajax-Pickering from 2011 to 2015 and Minister of Citizenship and Immigration from 2013 to 2015.", url: "https://chrisalexander.ca/"}
    record: []
    priorities:
      - {topic: other, text: "We’re a world-class city. The fact that we don’t act like one is not a money problem. It’s a leadership problem.", url: "https://chrisalexander.ca/"}
      - {topic: transit, text: "Real fare enforcement, so the system belongs to the people who are there to ride.", url: "https://chrisalexander.ca/"}
      - {topic: housing, text: "Housing affordability is about supply. But Toronto’s zoning is a maze, and our approvals are among the slowest in Canada.", url: "https://chrisalexander.ca/"}
      - {topic: housing, text: "As mayor, I would aim to see construction start on at least 3,000 affordable units in my first year in office, rising to 10,000 affordable housing starts in 2029.", url: "https://www.chrisalexander.ca/policies/build-affordable-housing"}
    archive:
      "https://chrisalexander.ca/": "https://web.archive.org/web/20261013044909/https://www.chrisalexander.ca/"
      "https://www.chrisalexander.ca/policies/build-affordable-housing": "https://web.archive.org/web/20261013042717/https://www.chrisalexander.ca/policies/build-affordable-housing"
    status: checked
    checked_on: 2026-10-13

