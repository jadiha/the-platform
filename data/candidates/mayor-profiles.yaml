      - {topic: housing, text: "If you're buying your first home, or you're a Toronto homeowner selling one home to buy another, you would pay no Municipal Land Transfer Tax on the first $1.1 million of the purchase.", url: "https://bradford26.ca/news/brad-bradford-toronto-mayor-will-eliminate-torontos-land-transfer-tax-for-the-average-homebuyer"}
      - {topic: transit, text: "Brad Bradford committed to removing the red bus lanes on Kingston Road, Morningside Avenue, Kennedy Road and Midland Road, and returning 12 kilometres of Scarborough road to everyone who uses it.", url: "https://bradford26.ca/news/brad-bradford-mayor-toronto-will-get-scarborough-moving-by-building-real-rapid-transit-and-removing-red-bus-lanes-scarborough-was-promised-an-lrt-it-got-red-paint"}
      - {topic: money, text: "Brad Bradford today announced that as mayor he will cut Toronto water bills by 25%.", url: "https://bradford26.ca/news/its-your-money-brad-bradford-mayor-toronto-is-giving-it-back"}
