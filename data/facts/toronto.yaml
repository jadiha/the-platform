# City of Toronto fact registry. Format: docs/data-contract.md. Money in $ millions unless unit says otherwise.
# Primary source for most values: 2026 City of Toronto Budget Summary (PDF). Values marked "pipeline-checked"
# are re-derived by pipeline/checks.py from the raw files, and the build fails if they drift.

toronto.operating.2026.gross:
  value: 18864
  unit: $M
  label: "Toronto's 2026 operating budget (tax and rate supported)"
  basis: "gross, approved budget"
  primary: {title: "2026 City of Toronto Budget Summary", url: "https://www.toronto.ca/wp-content/uploads/2026/05/8f04-2026-City-of-Toronto-Budget-Summary.pdf", locator: "p. 10, Figure 1 (sum of revenue sources)"}
  crosscheck:
    - {title: "The Canadian Press: Toronto city council approves 2026 budget including 2.2 per cent property tax hike", url: "https://www.am800cklw.com/news/toronto-city-council-approves-2026-budget-including-22-per-cent-property-tax-hike.html", date: 2026-02-10, value: 18900, note: "$18.9 billion, rounded"}
  status: verified
  note: "Pipeline-checked. Includes water, garbage and parking, which are paid for by user fees. The property-tax-supported part is $16.6 billion."
  as_of: 2026-10-12

