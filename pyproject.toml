[project]
name = "follow-the-budget-pipeline"
version = "0.1.0"
description = "Data pipeline for Follow the Budget"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "requests>=2.32",
    "pytest>=8.0",
    "lxml>=6.1.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
